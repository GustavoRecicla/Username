<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Reset de senha</title>
</head>
<body>
  <h3>Nova senha</h3>
  <input id="pwd" type="password" placeholder="Digite a nova senha" />
  <button onclick="reset()">Salvar</button>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const supabase = supabase.createClient(
      'https://lxeypkqyrrcmplpnmlim.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4ZXlwa3F5cnJjbXBscG5tbGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAzODI5OTMsImV4cCI6MjA4NTk1ODk5M30.pDP7EVD1fFpJqo4KeUsYY5kRhikftozrPukEW3vQOwA'
    )

    async function reset() {
      const password = document.getElementById('pwd').value
      const { error } = await supabase.auth.updateUser({ password })
      if (error) alert(error.message)
      else alert('Senha alterada com sucesso')
    }
  </script>
</body>
</html>
