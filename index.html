<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Redefinir senha</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; font-family: Arial, Helvetica, sans-serif; }
    body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,.25);
    }
    h1 {
      margin: 0 0 20px;
      font-size: 20px;
      text-align: center;
      color: #0f172a;
    }
    label { font-size: 13px; color: #334155; }
    .field { margin-top: 14px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      margin-top: 6px;
    }
    .toggle {
      font-size: 12px;
      color: #2563eb;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
    }
    .strength {
      height: 6px;
      border-radius: 6px;
      background: #e5e7eb;
      margin-top: 10px;
      overflow: hidden;
    }
    .strength span {
      display: block;
      height: 100%;
      width: 0;
      background: #dc2626;
      transition: width .3s, background .3s;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 24px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #94a3b8; }
    .msg {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
    }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    .info { color: #334155; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Redefinir senha</h1>

    <div class="field">
      <label>Nova senha</label>
      <input id="password" type="password" />
      <span class="toggle" onclick="toggle('password')">Mostrar senha</span>
      <div class="strength"><span id="bar"></span></div>
    </div>

    <div class="field">
      <label>Confirmar senha</label>
      <input id="confirm" type="password" />
      <span class="toggle" onclick="toggle('confirm')">Mostrar senha</span>
    </div>

    <button id="btn" onclick="resetPassword()" disabled>Salvar nova senha</button>

    <div id="msg" class="msg info"></div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase

    const client = createClient(
      'https://lxeypkqyrrcmplpnmlim.supabase.co',
      'SUA_ANON_KEY_AQUI'
    )

    const pwd = document.getElementById('password')
    const confirmPwd = document.getElementById('confirm')
    const bar = document.getElementById('bar')
    const msg = document.getElementById('msg')
    const btn = document.getElementById('btn')

    function toggle(id) {
      const el = document.getElementById(id)
      el.type = el.type === 'password' ? 'text' : 'password'
    }

    function validPassword(p) {
      return p.length >= 8 &&
        /[A-Z]/.test(p) &&
        /[a-z]/.test(p) &&
        /[0-9]/.test(p) &&
        /[^A-Za-z0-9]/.test(p)
    }

    // 🔥 CAPTURA TOKEN DA URL E CRIA SESSÃO
    async function initSession() {
      const hash = window.location.hash

      if (hash) {
        const params = new URLSearchParams(hash.replace('#', ''))
        const access_token = params.get('access_token')
        const refresh_token = params.get('refresh_token')

        if (access_token && refresh_token) {
          await client.auth.setSession({
            access_token,
            refresh_token
          })
        }
      }

      const { data } = await client.auth.getSession()

      if (!data.session) {
        msg.textContent = 'Link inválido ou expirado.'
        msg.className = 'msg error'
        btn.disabled = true
      }
    }

    initSession()

    pwd.oninput = () => {
      const score = [
        pwd.value.length >= 8,
        /[A-Z]/.test(pwd.value),
        /[0-9]/.test(pwd.value),
        /[^A-Za-z0-9]/.test(pwd.value)
      ].filter(Boolean).length

      bar.style.width = (score * 25) + '%'
      bar.style.background = score < 2 ? '#dc2626' : score < 3 ? '#f59e0b' : '#16a34a'
      btn.disabled = !(validPassword(pwd.value) && pwd.value === confirmPwd.value)
    }

    confirmPwd.oninput = () => {
      btn.disabled = !(validPassword(pwd.value) && pwd.value === confirmPwd.value)
    }

    async function resetPassword() {
      msg.textContent = 'Processando...'
      msg.className = 'msg info'

      const { error } = await client.auth.updateUser({
        password: pwd.value
      })

      if (error) {
        msg.textContent = 'Erro: a senha não foi alterada.'
        msg.className = 'msg error'
        return
      }

      const { data } = await client.auth.getUser()

      msg.textContent = 'Senha alterada com sucesso.'
      msg.className = 'msg success'

      // opcional: log
      await client.from('auth_audit').insert({
        user_id: data.user.id,
        email: data.user.email,
        event: 'PASSWORD_RESET'
      })

      await client.auth.signOut()

      // 🔥 REDIRECIONA
      setTimeout(() => {
        window.location.href = '/login'
      }, 2000)
    }
  </script>
</body>
</html>
